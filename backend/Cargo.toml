[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
cxx = "1.0"
cxx-qt = "0.9"
cxx-qt-lib = { version = "0.9" }
tokio = { version = "1.53", features = ["rt-multi-thread", "time", "macros"] }
tokio-util = { version = "0.7.19", features = ["rt"] }

[build-dependencies]
cxx-qt-build = { version = "0.9", features = ["link_qt_object_files"] }
cxx-build = "1.0"
