[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10" }
diesel = { version = "2,<2.3.8", features = ["sqlite", "returning_clauses_for_sqlite_3_35", "uuid", "chrono"] }
dotenvy = "0.15"
tokio = { version = "1,<1.49", features = ["rt-multi-thread", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
cxx-build = "1"
