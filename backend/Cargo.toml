[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["sql-uuid"]

[lib]
crate-type = ["staticlib"]

[dependencies]
chrono = "0.4"
csv = "1.4"
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10" }
diesel = { version = "2,<2.3.8", features = ["sqlite", "returning_clauses_for_sqlite_3_35", "uuid", "chrono", "r2d2"] }
diesel_migrations = { version = "2,<2.3.8", features = ["sqlite"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
static_assertions = "1.1.0"
sql-uuid = { path = "sql-uuid", features = ["v4"] }
thiserror = "2"
tokio = { version = "1,<1.49", features = ["rt-multi-thread", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2.5.8"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
#cxx-build = "1"

[patch.crates-io]
cxx = { git = "https://github.com/dtolnay/cxx.git", rev = "47d9bf7a5fae6657712e1e1373f1758b40fca660" }
cxx-gen = { git = "https://github.com/dtolnay/cxx.git", rev = "47d9bf7a5fae6657712e1e1373f1758b40fca660" }
